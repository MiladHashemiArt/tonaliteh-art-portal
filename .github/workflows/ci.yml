name: Free CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/one-off-session-bookings]

permissions:
  contents: read

concurrency:
  group: tonaliteh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format changed application files
        run: |
          bunx prettier --write \
            src/components/app/AppShell.tsx \
            src/components/app/JalaliDatePicker.tsx \
            src/components/app/ProfileAvatar.tsx \
            src/components/app/SessionLine.tsx \
            src/components/app/StatusBadge.tsx \
            src/components/ui/badge.tsx \
            src/components/ui/button.tsx \
            src/components/ui/form.tsx \
            src/components/ui/navigation-menu.tsx \
            src/components/ui/sidebar.tsx \
            src/components/ui/toggle.tsx \
            src/lib/backend/queries.ts \
            src/lib/backend/types.ts \
            src/routes/app.staff.attendance.tsx \
            src/routes/app.staff.occurrences.tsx \
            src/routes/app.staff.payments.tsx \
            src/routes/app.student.absences.tsx \
            src/routes/app.student.bookings.tsx \
            src/routes/app.student.payments.tsx

      - name: Run ESLint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build production app
        run: bun run build
