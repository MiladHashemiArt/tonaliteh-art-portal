name: Free CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/one-off-session-bookings]

permissions:
  contents: read

concurrency:
  group: tonaliteh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build production app
        run: bun run build
